version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Paseo supplies these at runtime; they must match the Paseo release in paseo-plugin.json.
    ignore:
      - dependency-name: "@getpaseo/plugin"
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: "@types/react"
      - dependency-name: "@tanstack/react-query"
      - dependency-name: zod
      # typescript-eslint supports one TypeScript major at a time; move both together by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
